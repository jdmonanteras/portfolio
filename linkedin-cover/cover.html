<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinkedIn Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Source+Serif+4:opsz,wght@8..60,600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --accent: #3ddc97;
    --text: #fafafa;
    --muted: #a1a1aa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; background: var(--bg); overflow: hidden; }

  .cover {
    position: relative;
    width: 1584px;
    height: 396px;
    background: var(--bg);
    overflow: hidden;
  }

  /* Skewed photo strips on the left */
  .strips {
    position: absolute;
    top: -20px;
    bottom: -20px;
    left: -50px;
    display: flex;
    gap: 10px;
  }
  .strip {
    width: 230px;
    height: 100%;
    overflow: hidden;
    transform: skewX(-10deg);
    border-radius: 2px;
  }
  .strip img {
    width: 150%;
    height: 100%;
    object-fit: cover;
    transform: skewX(10deg) translateX(-17%);
    filter: saturate(0.9) brightness(0.85);
  }
  .strip { position: relative; }
  .strip.accent::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 3px solid var(--accent);
    border-radius: 2px;
  }

  /* Fade the photos into the dark text area */
  .fade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(10,10,11,0) 0px, rgba(10,10,11,0) 560px, rgba(10,10,11,0.75) 820px, var(--bg) 960px),
      linear-gradient(0deg, rgba(10,10,11,0.35), rgba(10,10,11,0) 40%);
  }

  .glow {
    position: absolute;
    right: -120px;
    top: -160px;
    width: 640px;
    height: 640px;
    background: radial-gradient(circle, rgba(61,220,151,0.10) 0%, transparent 60%);
  }

  .text {
    position: absolute;
    left: 1000px;
    right: 64px;
    top: 50%;
    transform: translateY(-50%);
  }
  .rule {
    width: 48px;
    height: 3px;
    background: var(--accent);
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 60px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .role {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: var(--accent);
    margin-top: 14px;
  }
  .line {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 400;
    font-size: 18px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="glow"></div>
    <div class="strips">
      <div class="strip"><img src="../media/07252025_Pork Council Smithfield BTS SM-9.jpg" style="object-position: 30% 42%; transform: skewX(10deg) translateX(-2%)"></div>
      <div class="strip"><img src="../media/Jonas.jpg" style="object-position: 62% 40%"></div>
      <div class="strip accent"><img src="../media/JonasEvent3.jpeg" style="object-position: 55% 22%"></div>
      <div class="strip"><img src="../media/07252025_Pork Council Smithfield BTS SM-26.jpg" style="object-position: 58% 40%"></div>
    </div>
    <div class="fade"></div>
    <div class="text">
      <div class="rule"></div>
      <h1>Jonas Monanteras</h1>
      <div class="role">Immersive Producer &amp; Developer</div>
      <div class="line">VR, AR and real-time experiences in Unreal Engine,<br>from first pitch to final build.</div>    </div>
  </div>
</body>
</html>
