<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio Thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..600&family=Source+Serif+4:opsz,wght@8..60,600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --accent: #3ddc97;
    --text: #fafafa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 627px; background: var(--bg); overflow: hidden; }

  .thumb {
    position: relative;
    width: 1200px;
    height: 627px;
    overflow: hidden;
    background: var(--bg);
  }

  .panels {
    position: absolute;
    top: -20px;
    bottom: -20px;
    left: -90px;
    right: -90px;
    display: flex;
    gap: 12px;
  }
  .panel {
    position: relative;
    flex: 1;
    overflow: hidden;
    transform: skewX(-10deg);
  }
  .panel img {
    position: absolute;
    top: 0;
    left: -25%;
    width: 150%;
    height: 100%;
    object-fit: cover;
    transform: skewX(10deg);
    filter: saturate(0.9) brightness(0.7);
  }

  /* Dark center so the text stays legible over any photo */
  .scrim {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 52% 62% at 50% 50%, rgba(10,10,11,0.88) 0%, rgba(10,10,11,0.7) 55%, rgba(10,10,11,0.15) 100%),
      linear-gradient(0deg, rgba(10,10,11,0.45), rgba(10,10,11,0) 35%);
  }

  .text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .rule {
    width: 56px;
    height: 4px;
    background: var(--accent);
    margin-bottom: 26px;
  }
  .kicker {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 88px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-top: 10px;
  }
  .sub {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 500;
    font-size: 28px;
    color: #d4d4d8;
    margin-top: 18px;
  }
</style>
</head>
<body>
  <div class="thumb">
    <div class="panels">
      <div class="panel"><img src="../media/ClinQuest1.png" style="object-position: 30% 50%"></div>
      <div class="panel"><img src="../media/HistoricSite_Aycock.JPG" style="object-position: 40% 50%"></div>
      <div class="panel"><img src="../media/07252025_Pork Council Smithfield BTS SM-26.jpg" style="object-position: 55% 40%"></div>
    </div>
    <div class="scrim"></div>
    <div class="text">
      <div class="rule"></div>
      <div class="kicker">Portfolio</div>
      <h1>Jonas Monanteras</h1>
      <div class="sub">Immersive Producer &amp; Developer</div>
    </div>
  </div>
</body>
</html>
